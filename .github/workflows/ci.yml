name: macOS tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run tests
        run: swift test
      - name: Build release binary
        run: swift build -c release
