# earlyoom-mac safe starter configuration
# Both switches below must be changed before any action is possible.
[earlyoom]
enabled = false
report_only = true
interval = 5s
grace_period = 10s

[check]
metric = phys_footprint
warn_available = 20%
terminate_available = 10%
kill_available = 5%
minimum_candidate = 64MiB
criticality =

[action]
gui_escalation = never
allow_process_group = false

[suppression]
# These defaults preserve the current user/session and work terminals.
protect_current_user = true
protect_current_session = true
protect_ancestors = true
protect_process_groups = true
# Mandatory macOS infrastructure and session/work-preserving names are always
# unioned into this allow-list by the policy implementation.
names = launchd,kernel_task,WindowServer,loginwindow,mDNSResponder,securityd,syspolicyd,coreaudiod,sshd,sshd-session,Terminal,iTerm2,Alacritty,kitty,WezTerm,Ghostty,tmux,screen
# Add exact CFBundleIdentifier values here; do not use display-name substrings.
bundle_ids =
extra_uids =
